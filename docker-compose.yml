services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-it4us}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Please set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-it4us}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-it4us} -d ${POSTGRES_DB:-it4us}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  it4us:
    image: autumn27/it4us:${IT4US_TAG:-latest}
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      IT4US_PG_DSN: postgres://${POSTGRES_USER:-it4us}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-it4us}?sslmode=disable
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      IT4US_LLM_PROVIDER: ${IT4US_LLM_PROVIDER:-}
      IT4US_LLM_MODEL: ${IT4US_LLM_MODEL:-}
      IT4US_LLM_BASE_URL: ${IT4US_LLM_BASE_URL:-}
      IT4US_LLM_PROXY: ${IT4US_LLM_PROXY:-}
    ports:
      - "8787:8787"
      - "127.0.0.1:8788:8788"
    volumes:
      # Bind the data directory (jwt.key, SQLite, etc.) to data/ in the project root,
      # so it is easy to inspect/back up on the host and survives container rebuilds.
      - ./data:/app/data
      # Mount skills/ from the project root into the container (overriding the image's built-in /app/skills);
      # skill changes require no image rebuild — the container reads the host copy.
      - ./skills:/app/skills
    restart: unless-stopped

volumes:
  pgdata:
