name: guard4us

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: guard4us
      POSTGRES_PASSWORD: ${GUARD4US_DB_PASSWORD:?Set GUARD4US_DB_PASSWORD in .env}
      POSTGRES_DB: guard4us
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U guard4us -d guard4us"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile.va
      args:
        TARGETARCH: amd64
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      IT4US_PG_DSN: postgres://guard4us:${GUARD4US_DB_PASSWORD}@postgres:5432/guard4us?sslmode=disable
      IT4US_GMP_ADDR: ${IT4US_GMP_ADDR:-}
      IT4US_GMP_USER: ${IT4US_GMP_USER:-}
      IT4US_GMP_PASSWORD: ${IT4US_GMP_PASSWORD:-}
      GUARD4US_ENTRA_TENANT_ID: ${GUARD4US_ENTRA_TENANT_ID:-}
      GUARD4US_ENTRA_CLIENT_ID: ${GUARD4US_ENTRA_CLIENT_ID:-}
      GUARD4US_ENTRA_CLIENT_SECRET: ${GUARD4US_ENTRA_CLIENT_SECRET:-}
      GUARD4US_ENTRA_REDIRECT_URL: ${GUARD4US_ENTRA_REDIRECT_URL:-}
      GUARD4US_ENTRA_REQUIRED_ROLE: ${GUARD4US_ENTRA_REQUIRED_ROLE:-Guard4US.Access}
    volumes:
      - ./data:/app/data
      - ./jwt.key:/app/jwt.key
      - ./skills:/app/skills:ro
    command: ["-addr", ":8787"]
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      - app
    ports:
      - "9445:9445"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /opt/it4us-va/certbot/conf:/etc/letsencrypt:ro
    restart: unless-stopped

volumes:
  pgdata:
