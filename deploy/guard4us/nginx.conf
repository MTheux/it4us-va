limit_req_zone $binary_remote_addr zone=guard4us_login:10m rate=5r/m;

server {
    listen 9445 ssl;
    server_name 172.206.111.166;

    ssl_certificate /etc/letsencrypt/live/172.206.111.166/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/172.206.111.166/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # First administrator creation is available only through an SSH tunnel.
    location = /api/auth/init {
        allow 127.0.0.1;
        allow ::1;
        deny all;
        proxy_pass http://app:8787;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }

    location = /api/auth/login {
        limit_req zone=guard4us_login burst=4 nodelay;
        proxy_pass http://app:8787;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }

    location / {
        proxy_pass http://app:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 600s;
        client_max_body_size 10m;
    }
}
